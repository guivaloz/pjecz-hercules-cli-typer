[project]
name = "pjecz-hercules-cli-typer"
version = "0.1.0"
description = "Command Line Interface made with Typer and Python for Plataforma Web."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-auth>=2.49.2",
    "google-cloud>=0.34.0",
    "google-cloud-secret-manager>=2.27.0",
    "google-cloud-storage>=3.10.1",
    "hashids>=1.3.1",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.13.1",
    "pydantic-settings>=2.13.1",
    "pytz>=2026.2",
    "requests>=2.33.1",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.49",
    "sqlalchemy-utils>=0.42.1",
    "sqlmodel>=0.0.38",
    "typer>=0.24.1",
    "unidecode>=1.4.0",
]

[tool.black]
line-length = 128

[tool.isort]
line_length = 128
profile = "black"

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportCallIssue = "hint"
reportMissingImports = "warning"
reportUndefinedVariable = "warning"
exclude = ["**/tests"]

[tool.ruff]
ignore = ["F821"]
line-length = 128
